# 개발 환경 전용 compose 파일
#   실행: docker compose -f docker-compose.dev.yml up --build
#   - 운영 이미지를 베이스로 한 Dockerfile.dev 를 빌드한다.
#   - 로컬 소스를 컨테이너에 bind mount 하여 코드 수정이 즉시 반영된다.
#     · 백엔드(.py): uvicorn --reload 가 변경을 감지해 자동 재시작
#     · 프론트엔드(html/js/css): 정적 파일이므로 브라우저 새로고침만으로 반영
#   - 샘플 경로 데이터는 backend/data 를 그대로 사용한다.

services:
  patheditor-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: patheditor-dev:local
    container_name: patheditor-dev
    working_dir: /app/backend
    command: >
      uvicorn main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app/backend
    ports:
      # 운영 compose(8002)와 충돌하지 않도록 8003 사용
      - "8003:8000"
    volumes:
      # 백엔드 전체(소스 + 샘플 데이터)를 디렉터리째 마운트.
      # 단일 파일 마운트는 에디터의 atomic-save(임시파일 rename)로 inode가 바뀌면
      # 컨테이너가 변경을 못 보는 문제가 있어 디렉터리 마운트를 사용한다.
      # (컨테이너의 파이썬 의존성은 /usr/local 에 있으므로 영향 없음)
      - ./backend:/app/backend
      # 프론트엔드 (정적 서빙)
      - ./frontend:/app/frontend
    environment:
      - APP_DATA_DIR=/app/backend/data/path
      - PYTHONUNBUFFERED=1
      # bind mount 에서는 inotify 이벤트가 컨테이너로 전달되지 않는 경우가 많아
      # (특히 macOS/Windows 호스트) watchfiles 폴링 모드로 변경 감지를 보장한다.
      - WATCHFILES_FORCE_POLLING=true
      # Mapbox 위성 레이어를 쓰려면 토큰을 지정한다(미설정 시 Esri 위성으로 대체).
      # - MAPBOX_TOKEN=pk....
      # CORS 허용 출처(쉼표 구분). 미설정 시 "*"(개발용, credentials 비활성).
      # - CORS_ALLOW_ORIGINS=http://localhost:8003
    restart: unless-stopped
