<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCV Path Editor Web</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="header">
            <h1>SCV Path Editor Web</h1>
            <div class="header-controls">
                <button id="loadBtn" class="btn btn-primary">Load</button>
                <button id="saveBtn" class="btn btn-primary">Save</button>
                <input type="file" id="fileInput" accept=".json" style="display: none;">
                <button id="uploadBtn" class="btn btn-secondary">Upload</button>
                <button id="downloadBtn" class="btn btn-secondary">Download</button>
            </div>
        </header>

        <button id="menu-btn" class="floating-toggle" aria-controls="right-pn" aria-expanded="true">
            테이블 및 정보
        </button>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Left Panel - Controls -->
            <div class="left-panel">
                <div class="control-section">
                    <h3>편집 모드</h3>
                    <div class="mode-buttons">
                        <button id="selectModeBtn" class="btn btn-mode">Select Node</button>
                        <button id="dragModeBtn" class="btn btn-mode">Drag Node</button>
                        <button id="addNodeModeBtn" class="btn btn-mode">Add Node</button>
                        <button id="quickLinkModeBtn" class="btn btn-mode">Quick Link</button>
                        <button id="intervalCreateModeBtn" class="btn btn-mode">구간 노드 생성</button>
                        <button id="deleteModeBtn" class="btn btn-mode">Delete Node</button>
                    </div>
                </div>

                <div class="control-section">
                    <h3>지도 옵션</h3>
                    <div class="form-check">
                        <input type="checkbox" id="toggleNodeIds" class="form-check-input" checked>
                        <label for="toggleNodeIds" class="form-check-label">노드 ID 표시</label>
                    </div>
                    <div class="form-group">
                        <label for="mapStyleSelect">지도 스타일:</label>
                        <select id="mapStyleSelect" class="form-control">
                            <option value="street" selected>일반 지도</option>
                            <option value="satellite">위성 지도</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="nodeInterval">구간 간격 (m):</label>
                        <input type="number" id="nodeInterval" class="form-control" value="10" min="1">
                    </div>
                </div>

                <div class="control-section">
                    <h3>파일 탐색기</h3>
                    <div class="file-explorer">
                        <div class="file-explorer-header">
                            <button id="refreshFiles" class="btn-icon" title="파일 목록 새로보기">
                                <span>새로고침</span>
                            </button>
                            <button id="newFolder" class="btn-icon" title="새 폴더">
                                <span>새 폴더</span>
                            </button>
                        </div>
                        <div class="file-tree" id="fileTree">
                            <div class="file-item loading">
                                <span class="file-icon">⏳</span>
                                <span class="file-name">로딩 중...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Center Panel - Map -->
            <div class="center-panel">
                <div id="map" class="map-container"></div>
            </div>

            <!-- Right Panel - Data Tables -->
            <div class="right-panel" id="right-pn">
                <div class="table-section">

                <!--노드 테이블-->
                <details open>
                    <summary>노드 테이블</summary>
                    <div class="table-container">
                        <table id="nodeTable" class="data-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>위도</th>
                                    <th>경도</th>
                                    <th>고도</th>
                                    <th>UTM E</th>
                                    <th>UTM N</th>
                                    <th>Zone</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </details>

                <!--링크 테이블-->
                <details open>
                    <summary>링크 테이블</summary>
                    <div class="table-section">
                        <div class="table-container">
                            <table id="linkTable" class="data-table">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>From</th>
                                        <th>To</th>
                                        <th>Length (km)</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody></tbody>
                            </table>
                        </div>
                    </div>
                </details>
                
                <!--선택된 노드 정보-->
                <details open>
                    <summary>선택된 노드 정보</summary>
                    <div class="control-section">
                        <div id="selectedNodeInfo">
                            <p>노드를 선택해주세요</p>
                        </div>
                        <button id="editBtn" class="btn btn-mode">수정</button>
                    </div>
                </details>

            </div>
        </div>
    </div>

    <!-- Modals -->
    <div id="nodeModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>노드 추가</h3>
                <span class="close">&times;</span>
            </div>
            <div class="modal-body">
                <form id="nodeForm">
                    <div class="form-group">
                        <label>위도:</label>
                        <input type="number" id="nodeLat" step="any" readonly>
                    </div>
                    <div class="form-group">
                        <label>경도:</label>
                        <input type="number" id="nodeLon" step="any" readonly>
                    </div>
                    <div class="form-group">
                        <label>고도:</label>
                        <input type="number" id="nodeAlt" step="any" value="0">
                    </div>
                    <div class="form-group">
                        <label>Maker:</label>
                        <input type="text" id="nodeMaker" value="SCV Web Editor">
                    </div>
                    <div class="form-group">
                        <label>Remark:</label>
                        <input type="text" id="nodeRemark" value="">
                    </div>
                    <div class="form-group">
                        <label>NodeType:</label>
                        <input type="text" id="nodeType" value="">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" id="saveNodeBtn" class="btn btn-primary">저장</button>
                <button type="button" id="cancelNodeBtn" class="btn btn-secondary">취소</button>
            </div>
        </div>
    </div>

    <div id="saveModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>파일 저장</h3>
                <span class="close">&times;</span>
            </div>
            <div class="modal-body">
                <form id="saveForm">
                    <div class="form-group">
                        <label>파일명:</label>
                        <input type="text" id="saveFilename" placeholder="filename.json">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" id="confirmSaveBtn" class="btn btn-primary">저장</button>
                <button type="button" id="cancelSaveBtn" class="btn btn-secondary">취소</button>
            </div>
        </div>
    </div>

    <!-- Loading Spinner -->
    <div id="loading" class="loading" style="display: none;">
        <div class="spinner"></div>
        <p>처리 중...</p>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/api.js"></script>
    <script src="js/file-explorer.js"></script>
    <script src="js/map.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>

<script>
    const panel = document.getElementById('right-pn');
    const btn = document.getElementById('menu-btn');

    btn.addEventListener('click', () => {
    const hidden = panel.classList.toggle('is-hidden');
    btn.setAttribute('aria-expanded', String(!hidden));

    // Leaflet 맵이 있다면 크기 재계산
    if (!hidden && window.pathMap?.leafletMap) {
        setTimeout(() => window.pathMap.leafletMap.invalidateSize(), 0);
    }
    });
</script>
