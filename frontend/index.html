<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCV Path Editor Web</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="icon" href="data:,">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <h1>SCV Path Editor Web</h1>
                <div class="file-controls">
                    <a href="map-load.html" class="btn btn-secondary" style="text-decoration:none;">🗺️ 지도로 불러오기</a>
                    <button id="loadBtn" class="btn btn-primary">Open File</button>
                    <button id="importBtn" class="btn btn-primary">Import File</button>
                    <button id="saveBtn" class="btn btn-primary">Save</button>
                    <input type="file" id="fileInput" accept=".json" style="display: none;">
                    <button id="uploadBtn" class="btn btn-secondary">Upload</button>
                    <button id="downloadBtn" class="btn btn-secondary">Download</button>
                </div>
            </div>
        </header>

        <button id="menu-btn" class="floating-toggle" aria-controls="right-pn" aria-expanded="true">
            테이블 및 정보
        </button>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Left Panel - Controls -->
            <div class="left-panel">

                <div class="control-section">
                    <p class="big-text">뷰 설정</p>
                    <div class="form-group">
                        <p class="middle-text">지도 스타일</p>
                        <select id="mapStyleSelect" class="form-control" style="margin-left:10px;">
                            <option value="street" selected>일반 지도</option>
                            <option value="satellite">위성 지도 (Google 21레벨)</option>
                            <option value="hybrid">하이브리드 (Google 위성+라벨) 🎯</option>
                            <option value="terrain">지형 지도 (Google Terrain) 🏔️</option>
                            <option value="dark">다크 모드 (CartoDB Dark) 🌙</option>
                            <option value="bing">위성 지도 (Bing 20레벨)</option>
                            <option value="mapbox">위성 지도 (Mapbox 22레벨)</option>
                            <option value="yandex">위성 지도 (Yandex 21레벨)</option>
                            <option value="carto">지형 지도 (Carto 20레벨)</option>
                        </select>
                    </div>
                    <div class="form-check">
                        <input type="checkbox" id="toggleNodeIds" class="form-check-input" checked>
                        <p class="small-text">노드 ID 표시</p>
                    </div>
                </div>

                <div class="control-section">
                    <p class="big-text">도구</p>
                    <div class="mode-buttons">
                        <p class="middle-text">노드</p>
                        <button id="selectModeBtn" class="btn btn-mode">복수 선택 모드</button>
                        <button id="addNodeModeBtn" class="btn btn-mode">생성 모드</button>
                        <button id="dragModeBtn" class="btn btn-mode">이동 모드</button>
                        <button id="deleteModeBtn" class="btn btn-mode">삭제 모드<br/>(미구현)</button>
                    </div>
                    <div class="mode-buttons">
                        <p class="middle-text">편집</p>
                        <button id="cutNodesBtn" class="btn btn-secondary" disabled>✂️ 잘라내기</button>
                        <button id="pasteNodesBtn" class="btn btn-secondary" disabled>📍 붙여넣기 (비활성)</button>
                        <button id="clearClipboardBtn" class="btn btn-secondary" disabled>🗑️ 클립보드 비우기</button>
                        <div class="clipboard-status" id="clipboardStatus">
                            📭 클립보드가 비어있습니다
                        </div>
                    </div>
                    <div class="mode-buttons">
                        <p class="middle-text">구간 노드</p>
                        <div class="form-group">
                            <label for="nodeInterval">구간 간격 (m):</label>
                            <input type="number" id="nodeInterval" class="form-control" value="10" min="1" style="margin-left:10px;width:30%;">
                        </div>
                        <button id="intervalCreateModeBtn" class="btn btn-mode">구간 노드 생성</button>
                    </div>
                    <div class="mode-buttons">
                        <p class="middle-text">링크</p>
                        <button id="linkTwoNodesModeBtn" class="btn btn-mode">두 노드 잇기 모드</button>
                        <button id="linkManyNodesModeBtn" class="btn btn-mode">여러 노드 잇기 모드<br/>(미구현)</button>
                    </div>
                </div>

                <div class="control-section">
                    <p class="big-text">파일탐색기</p>
                    <div class="file-explorer">
                        <!-- 변경: 삭제 버튼 추가 -->
                        <div class="file-explorer-header">
                            <button id="refreshFiles" class="btn-icon" title="파일 목록 새로보기">
                                <span>새로고침</span>
                            </button>
                            <button id="newFolder" class="btn-icon" title="새 폴더">
                                <span>새 폴더</span>
                            </button>
                            <button id="deleteFile" class="btn-icon" title="선택 파일 삭제">
                                <span>삭제</span>
                            </button>
                        </div>
                        <div class="file-explorer-pathbar">
                            <!-- index.html, 파일탐색기 패널의 경로바 옆 -->
                            <button id="goRootFolder" class="btn-icon" title="루트로">⌂</button>
                            <button id="goUpFolder" class="btn-icon" title="상위 폴더로">⬆</button>
                            <span id="fileExplorerPath">/</span>
                        </div>
                        <div class="file-tree" id="fileTree">
                            <div class="file-item loading">
                                <span class="file-icon">⏳</span>
                                <span class="file-name">로딩 중...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Center Panel - Map -->
            <div class="center-panel">
                <div id="map" class="map-container"></div>
            </div>

            <!-- Right Panel - Data Tables -->
            <div class="right-panel" id="right-pn">
                <div class="table-section">

                <!--노드 테이블-->
                <details open>
                    <summary>노드 테이블</summary>
                    <div class="table-container">
                        <table id="nodeTable" class="data-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>위도</th>
                                    <th>경도</th>
                                    <th>고도</th>
                                    <th>UTM E</th>
                                    <th>UTM N</th>
                                    <th>Zone</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </details>

                <!--링크 테이블-->
                <details open>
                    <summary>링크 테이블</summary>
                    <div class="table-section">
                        <div class="table-container">
                            <table id="linkTable" class="data-table">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>From</th>
                                        <th>To</th>
                                        <th>Length (km)</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody></tbody>
                            </table>
                        </div>
                    </div>
                </details>
                
                <!--선택된 노드 속성-->
                <details open>
                    <summary>선택된 노드 속성</summary>
                    <div class="control-section">
                        <div id="selectedNodeInfo">
                            <p>노드를 선택해주세요</p>
                        </div>
                        <button id="editBtn" class="btn btn-mode">단일 노드 속성 수정</button>
                        <button id="batchEditBtn" class="btn btn-mode">선택된 노드 속성 일괄 수정</button>
                    </div>
                </details>

            </div>
        </div>
    </div>

    <!-- Modals -->
    <div id="nodeModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>노드 추가</h3>
                <span class="close">&times;</span>
            </div>
            <div class="modal-body">
                <form id="nodeForm">
                    <div class="form-group">
                        <label>위도:</label>
                        <input type="number" id="nodeLat" step="any" readonly>
                    </div>
                    <div class="form-group">
                        <label>경도:</label>
                        <input type="number" id="nodeLon" step="any" readonly>
                    </div>
                    <div class="form-group">
                        <label>고도:</label>
                        <input type="number" id="nodeAlt" step="any" value="0">
                    </div>
                    <div class="form-group">
                        <label>Maker:</label>
                        <input type="text" id="nodeMaker" value="SCV Web Editor">
                    </div>
                    <div class="form-group">
                        <label>Remark:</label>
                        <input type="text" id="nodeRemark" value="">
                    </div>
                    <div class="form-group">
                        <label>NodeType:</label>
                        <input type="number" id="nodeType" value="1" min="1" step="1"/>
                    </div>
                    <div class="form-group">
                        <label>Heading:</label>
                        <input type="number" id="nodeHeading" value="-1.0" step="any" step="0.1"/>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" id="saveNodeBtn" class="btn btn-primary">저장</button>
                <button type="button" id="cancelNodeBtn" class="btn btn-secondary">취소</button>
            </div>
        </div>
    </div>

    <div id="batchEditModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>선택된 노드 속성 일괄 수정</h3>
                <span class="close">&times;</span>
            </div>
            <div class="modal-body">
                <form id="batchForm">
                    <div class="form-group">
                        <label>고도(Alt):</label>
                        <input type="number" id="batchAlt" step="any" placeholder="값 입력 시 일괄 덮어쓰기">
                    </div>
                    <div class="form-group">
                        <label>Maker:</label>
                        <input type="text" id="batchMaker" placeholder="값 입력 시 일괄 덮어쓰기">
                    </div>
                    <div class="form-group">
                        <label>NodeType:</label>
                        <input type="number" id="batchNodeType" min="1" step="1" placeholder="값 입력 시 일괄 덮어쓰기">
                    </div>
                    <div class="form-group">
                        <label>Heading:</label>
                        <input type="number" id="batchHeading" step="any" placeholder="값 입력 시 일괄 덮어쓰기">
                    </div>
                </form>
                <p class="middle-text" style="margin-top:6px;color:#666">※ 빈 칸은 변경하지 않습니다.</p>
            </div>
            <div class="modal-footer">
                <button type="button" id="applyBatchBtn" class="btn btn-primary">적용</button>
                <button type="button" id="cancelBatchBtn" class="btn btn-secondary">취소</button>
            </div>
        </div>
    </div>


        <div id="saveModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>파일 저장</h3>
                <span class="close">&times;</span>
            </div>
            <div class="modal-body">
                <form id="saveForm">
                    <div class="form-group">
                        <label>파일명:</label>
                        <input type="text" id="saveFilename" placeholder="filename.json">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" id="confirmSaveBtn" class="btn btn-primary">저장</button>
                <button type="button" id="cancelSaveBtn" class="btn btn-secondary">취소</button>
            </div>
        </div>
    </div>

    <!-- Loading Spinner -->
    <div id="loading" class="loading" style="display: none;">
        <div class="spinner"></div>
        <p>처리 중...</p>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/api.js"></script>
    <script src="js/file-explorer.js"></script>
    <script src="js/map.js"></script>
    <script src="js/utm-validator.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>

<script>
    const panel = document.getElementById('right-pn');
    const btn = document.getElementById('menu-btn');

    btn.addEventListener('click', () => {
    const hidden = panel.classList.toggle('is-hidden');
    btn.setAttribute('aria-expanded', String(!hidden));

    // Leaflet 맵이 있다면 크기 재계산
    if (!hidden && window.pathMap?.leafletMap) {
        setTimeout(() => window.pathMap.leafletMap.invalidateSize(), 0);
    }
    });
</script>
