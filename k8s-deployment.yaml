# SCV Path Editor — Kubernetes 매니페스트
# 실제 운영(클러스터 path-editor 네임스페이스)에 맞춰 정비된 매니페스트.
#   - 네임스페이스: path-editor
#   - 이미지: harbor.cu.ac.kr/patheditor/patheditor:latest (imagePullPolicy: Always)
#   - 서비스: NodePort 30725 (port 80 → targetPort 8000)
#   - 스토리지: StorageClass "normal-r3" 로 프로비저닝되는 PVC (1Gi, RWO)
# 코드 변경 반영은 CI(harbor 에 :latest 재빌드/푸시) 후 다음으로 수행:
#   kubectl -n path-editor rollout restart deploy/scv-path-editor   (pullPolicy: Always)

# ---------------- Persistent Volume Claim (PVC) ---------------- #
# 클러스터의 StorageClass "normal-r3" 가 볼륨을 동적으로 제공한다.
# (운영에는 이미 'scv-path-editor-pvc' 가 바운드되어 있음)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: scv-path-editor-pvc
  namespace: path-editor
spec:
  storageClassName: normal-r3
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---

# ---------------------- Deployment ---------------------- #
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scv-path-editor
  namespace: path-editor
  labels:
    app: scv-path-editor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scv-path-editor
  template:
    metadata:
      labels:
        app: scv-path-editor
    spec:
      volumes:
        - name: path-storage
          persistentVolumeClaim:
            claimName: scv-path-editor-pvc
      containers:
      - name: scv-path-editor
        # CI 파이프라인이 harbor 에 push 하는 운영 이미지
        image: harbor.cu.ac.kr/patheditor/patheditor:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        volumeMounts:
          # 경로 데이터 영속화 (APP_DATA_DIR=/app/backend/data/path 의 상위)
          - name: path-storage
            mountPath: /app/backend/data
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"

---

# ------------------------ Service ------------------------ #
apiVersion: v1
kind: Service
metadata:
  name: scv-path-editor-service
  namespace: path-editor
spec:
  type: NodePort
  selector:
    app: scv-path-editor
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
      nodePort: 30725
